# The approved type checker (owner, 2026-11-07, ARCH-1): on the two new modules of the
# analysis split only, `core/findings.py` and `core/describe.py`. Not the rest of the
# codebase. Run: .venv/bin/python -m mypy zugzwang/core/findings.py zugzwang/core/describe.py
[mypy]
python_version = 3.13
strict = True
follow_imports = silent
ignore_missing_imports = True
warn_unused_configs = True
