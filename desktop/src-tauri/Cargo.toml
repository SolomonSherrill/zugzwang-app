[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
tauri-plugin-shell = "2"
tauri-plugin-opener = "~2.7"
tauri-plugin-updater = "~2.14"
tauri-plugin-process = "~2.4"

[dev-dependencies]
# `test`: Tauri's mock runtime, for the headless dev-spawn check (src/dev_spawn_test.rs).
# `macos-private-api` only so the mock compiles on macOS: tauri 2.12.0's MockWindowBuilder
# gates `transparent` behind it while tauri-runtime 2.12.2's trait no longer does. Test
# builds only (resolver 2 keeps dev-dependency features out of the app).
tauri = { version = "2.11.2", features = ["test", "macos-private-api"] }
