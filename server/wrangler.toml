# The Zugzwang Friends server (FRIENDS.md, FRIENDS-1 B): a Cloudflare Worker over one D1 database.
# Deploy steps: server/README.md. Deployed 2026-11-22 (FRIENDS-1B C) at https://api.zugzwangapp.com, a Workers
# custom domain (FRIENDS.md ruling V8); the database_id is the one `wrangler d1 create zugzwang-friends`
# printed. The local runs (tests, `wrangler dev --local`) do not use it.
name = "zugzwang-friends"
main = "src/index.ts"
compatibility_date = "2026-11-01"
# Served only at the custom domain. (The account's workers.dev subdomain exists since 2026-11-23, made because
# Durable Objects cannot deploy without one; this Worker is not served there.)
workers_dev = false
preview_urls = false
routes = [{ pattern = "api.zugzwangapp.com", custom_domain = true }]

[[d1_databases]]
binding = "DB"
database_name = "zugzwang-friends"
database_id = "21546d72-4bfe-4b51-b247-14d608674d38"
migrations_dir = "migrations"

# FRIENDS-2: the lobby (challenges and the apps' live connections) and one object per live game, both
# SQLite-backed (the only kind the Workers Free plan has), WebSockets through the Hibernation API.
[[durable_objects.bindings]]
name = "LOBBY"
class_name = "Lobby"

[[durable_objects.bindings]]
name = "GAME"
class_name = "Game"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Lobby", "Game"]

[vars]
LICHESS_API = "https://lichess.org"
CHESSCOM_API = "https://api.chess.com"
# The owner's admin public key (base64url, 32 bytes) for scripts/admin.mjs (its private half:
# ~/.config/zugzwang/friends-admin-key.json, made 2026-11-22); empty: no admin requests.
ADMIN_PUBLIC_KEY = "O3IpPw4Y3w45k78MEm-fNPkGfr2NCZiU3RTt4fIrAs8"

# LINK_SECRET (the key the Chess.com codes are derived from) is a secret, never here:
#   npx wrangler secret put LINK_SECRET

# Per-account and per-address request limits, counted by Cloudflare (never stored by this code).
[[ratelimits]]
name = "ACCOUNT_LIMITER"
namespace_id = "41001"
simple = { limit = 120, period = 60 }

[[ratelimits]]
name = "ANON_LIMITER"
namespace_id = "41002"
simple = { limit = 20, period = 60 }
